<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera + DA2 Depth + Crop + Beauty</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h2 { margin: 8px 0; }

    #status {
      min-height: 1.4em;
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
      text-align: center;
    }

    #status.busy { color: #ffb347; }
    #status.ready { color: #7dffb3; }
    #status.error { color: #ff6b6b; }

    .preview-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .panel {
      flex: 1 1 320px;
      max-width: 580px;
    }

    .panel label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    video, canvas {
      width: 100%;
      border-radius: 12px;
      background: #111;
      display: block;
    }

    canvas.processing {
      opacity: 0.55;
      filter: grayscale(0.2);
    }

    /* camera overlay: video normal flow, bbox canvas on top */
    .cam-wrapper {
      position: relative;
    }
    .cam-wrapper video {
      display: block;
      width: 100%;
    }
    .cam-wrapper canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: transparent;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2a2a2a;
      color: #fff;
    }

    button:hover:not(:disabled) { background: #3a3a3a; }

    button.primary { background: #2563eb; }
    button.primary:hover:not(:disabled) { background: #1d4ed8; }

    button.active { background: #059669; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .score-item {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }
    .score-label { font-size: 11px; color: #888; }
    .score-value { font-size: 16px; font-weight: bold; color: #e94560; }
    .score-value.high { color: #4CAF50; }
    .score-value.mid { color: #FF9800; }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h2>📷 SXT + DA2 SD + CQ + MX</h2>
  <div id="status">ZZCSH…</div>

  <div class="preview-row">
    <div class="panel">
      <label>SXT</label>
      <div class="cam-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="bboxCanvas"></canvas>
      </div>
      <div class="scores" id="scoreBoard">
        <div class="score-item"><div class="score-label">ZH</div><div class="score-value" id="s-total">-</div></div>
        <div class="score-item"><div class="score-label">YS</div><div class="score-value" id="s-element">-</div></div>
        <div class="score-item"><div class="score-label">GS</div><div class="score-value" id="s-story">-</div></div>
        <div class="score-item"><div class="score-label">GT</div><div class="score-value" id="s-composition">-</div></div>
        <div class="score-item"><div class="score-label">GY</div><div class="score-value" id="s-light">-</div></div>
        <div class="score-item"><div class="score-label">FW</div><div class="score-value" id="s-atmosphere">-</div></div>
      </div>
    </div>
    <div class="panel">
      <label>SDT（Depth Anything V2 Small）</label>
      <canvas id="depthCanvas"></canvas>
    </div>
  </div>

  <div class="controls">
    <button onclick="startCamera()">QDSXT</button>
    <button id="captureBtn" onclick="takePhoto()" disabled>PZBC</button>
    <button id="depthBtn" onclick="estimateDepthOnce()" disabled>SDGS</button>
    <button id="autoDepthBtn" onclick="toggleAutoDepth()" disabled>SDZD：G</button>
    <button id="cbBtn" class="primary" onclick="runCropBeauty()" disabled>CQ+MX</button>
    <button id="autoCbBtn" onclick="toggleAutoCb()" disabled>MXZD：G</button>
    <button id="allBtn" onclick="runAll()" disabled>QCTL</button>
    <button id="autoAllBtn" onclick="toggleAutoAll()" disabled>QZD：G</button>
  </div>

  <p class="hint">
    TLZLLQBDYX（WASM）。CQ+XM XEWXZY 92 MB MX（SC）。
    ZDMS ASZWC + 1.5 MJL。QY <code>python serve.py</code> QD。
  </p>

  <canvas id="canvas" hidden></canvas>

  <script src="vendor/onnxruntime-web/ort.wasm.min.js?v=5"></script>
  <script src="depth.js?v=5"></script>
  <script src="crop_beauty.js?v=1"></script>
  <script>
    const WASM_BASE = new URL('vendor/onnxruntime-web/', window.location.href).href;
    const AUTO_INTERVAL_MS = 1500;
    const RUNTIME_CONFIG_URL = 'models/runtime_config.json';
    const CROP_MODEL_URL = 'models/crop_model.onnx';
    const BEAUTY_MODEL_URL = 'models/beauty_score.onnx';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const depthCanvas = document.getElementById('depthCanvas');
    const depthCtx = depthCanvas.getContext('2d');
    const bboxCanvas = document.getElementById('bboxCanvas');
    const bboxCtx = bboxCanvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const captureBtn = document.getElementById('captureBtn');
    const depthBtn = document.getElementById('depthBtn');
    const autoDepthBtn = document.getElementById('autoDepthBtn');
    const cbBtn = document.getElementById('cbBtn');
    const autoCbBtn = document.getElementById('autoCbBtn');
    const allBtn = document.getElementById('allBtn');
    const autoAllBtn = document.getElementById('autoAllBtn');

    const SCORE_KEYS = ['total','element','story','composition','light','atmosphere'];

    let depthReady = false;
    let cropReady = false;
    let beautyReady = false;
    let inferring = false;
    let autoDepth = false, autoDepthTimer = null;
    let autoCb = false, autoCbTimer = null;
    let autoAll = false, autoAllTimer = null;

    let lastBbox = null;

    function setStatus(text, kind = '') {
      statusEl.textContent = text; statusEl.className = kind;
    }

    function updateScoreDisplay(scores) {
      for (const k of SCORE_KEYS) {
        const el = document.getElementById('s-' + k);
        const v = Math.round(scores[k]);
        el.textContent = v;
        el.className = 'score-value' + (v >= 75 ? ' high' : v >= 50 ? ' mid' : '');
      }
    }

    function drawBbox(bbox) {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      bboxCanvas.width = vw; bboxCanvas.height = vh;
      bboxCtx.clearRect(0, 0, vw, vh);
      if (!bbox) return;
      const bx = Math.round(bbox[0]*vw), by = Math.round(bbox[1]*vh);
      const bw = Math.round((bbox[2]-bbox[0])*vw), bh = Math.round((bbox[3]-bbox[1])*vh);
      bboxCtx.strokeStyle = '#00FF00';
      bboxCtx.lineWidth = Math.max(3, vw/320);
      bboxCtx.strokeRect(bx, by, bw, bh);
    }

    function updateAllControls() {
      const camOn = !!video.srcObject;
      depthBtn.disabled = !(depthReady && camOn && !inferring);
      autoDepthBtn.disabled = !(depthReady && camOn);
      cbBtn.disabled = !(cropReady && beautyReady && camOn && !inferring);
      autoCbBtn.disabled = !(cropReady && beautyReady && camOn);
      allBtn.disabled = !(depthReady && cropReady && beautyReady && camOn && !inferring);
      autoAllBtn.disabled = !(depthReady && cropReady && beautyReady && camOn);
    }

    async function initDepth() {
      if (location.protocol === 'file:') {
        setStatus('QY http://127.0.0.1:8080 DKYM', 'error');
        return;
      }
      if (typeof ort === 'undefined') {
        setStatus('ONNX Runtime WJZ', 'error');
        return;
      }
      try {
        const rc = await DepthEngine.loadRuntimeConfig(RUNTIME_CONFIG_URL);
        const mu = rc?.modelUrl || 'models/depth_anything_v2_small.onnx';
        const { numThreads, inputSize } = await DepthEngine.initDepthModel({
          modelUrl: mu, wasmBase: WASM_BASE, runtimeConfig: rc,
          onStatus: (t) => setStatus(t),
        });
        depthReady = true;
        setStatus('SDMXJX，JZCQ+MXMX…', 'ready');
        updateAllControls();

        // load crop + beauty models in parallel
        await Promise.all([
          CropBeautyEngine.initCropModel({ wasmBase: WASM_BASE, modelUrl: CROP_MODEL_URL,
            onStatus: (t) => setStatus(t) }),
          CropBeautyEngine.initBeautyModel({ wasmBase: WASM_BASE, modelUrl: BEAUTY_MODEL_URL,
            onStatus: (t) => setStatus(t) }),
        ]);
        cropReady = true; beautyReady = true;
        const threadHint = numThreads > 1 ? `（${numThreads}XC）` : '（DXC）';
        setStatus(`QBMXJX ${inputSize}px${threadHint}，QQDSXT`, 'ready');
        updateAllControls();
      } catch (err) {
        console.error(err);
        setStatus('JZSB：' + (err.message || err), 'error');
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        video.srcObject = stream;
        await video.play();

        depthCanvas.width = video.videoWidth || 640;
        depthCanvas.height = video.videoHeight || 480;
        depthCtx.fillStyle = '#111';
        depthCtx.fillRect(0, 0, depthCanvas.width, depthCanvas.height);

        captureBtn.disabled = false;
        updateAllControls();
        setStatus('JX', 'ready');
      } catch (err) {
        alert('SXTQDSB：' + err);
      }
    }

    function takePhoto() {
      if (!video.srcObject) { alert('QXQDSXT'); return; }
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `photo-${Date.now()}.jpg`; a.click();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.92);
    }

    // ── Depth ──
    async function runDepthInference() {
      if (!depthReady || !video.srcObject || inferring) return;
      inferring = true;
      depthCanvas.classList.add('processing');
      setStatus('SDTLZ…', 'busy');
      updateAllControls();
      try {
        const r = await DepthEngine.inferDepthFromVideo(video);
        depthCanvas.width = r.width; depthCanvas.height = r.height;
        depthCtx.putImageData(r.imageData, 0, 0);
        setStatus(`SD ${r.elapsedMs.toFixed(0)} ms`, 'ready');
      } catch (err) {
        setStatus('SDSB：' + (err.message || err), 'error');
      } finally {
        inferring = false;
        depthCanvas.classList.remove('processing');
        updateAllControls();
        scheduleAutoDepth();
        scheduleAutoAll();
      }
    }
    function estimateDepthOnce() { stopAllAutoExcept('depth'); runDepthInference(); }
    function toggleAutoDepth() {
      autoDepth = !autoDepth;
      autoDepthBtn.textContent = autoDepth ? 'SDZD：K' : 'SDZD：G';
      autoDepthBtn.classList.toggle('active', autoDepth);
      if (autoDepth) scheduleAutoDepth(true); else { clearTimeout(autoDepthTimer); autoDepthTimer = null; }
    }
    function scheduleAutoDepth(immediate) {
      if (!autoDepth) return;
      clearTimeout(autoDepthTimer);
      autoDepthTimer = setTimeout(() => { if (!inferring) runDepthInference(); }, immediate ? 0 : AUTO_INTERVAL_MS);
    }

    // ── Crop + Beauty ──
    async function runCropBeauty() {
      if (!cropReady || !beautyReady || !video.srcObject || inferring) return;
      inferring = true;
      setStatus('CQ+XMTLZ…', 'busy');
      updateAllControls();
      try {
        const r = await CropBeautyEngine.runCropAndBeauty(video);
        lastBbox = r.bbox;
        drawBbox(r.bbox);
        updateScoreDisplay(r);
        setStatus(`CQ ${r.cropMs.toFixed(0)} ms + MX ${r.beautyMs.toFixed(0)} ms`, 'ready');
      } catch (err) {
        setStatus('CQ+MXSB：' + (err.message || err), 'error');
      } finally {
        inferring = false;
        updateAllControls();
        scheduleAutoCb();
        scheduleAutoAll();
      }
    }
    function toggleAutoCb() {
      autoCb = !autoCb;
      autoCbBtn.textContent = autoCb ? 'MXZD：K' : 'MXZD：G';
      autoCbBtn.classList.toggle('active', autoCb);
      if (autoCb) scheduleAutoCb(true); else { clearTimeout(autoCbTimer); autoCbTimer = null; }
    }
    function scheduleAutoCb(immediate) {
      if (!autoCb) return;
      clearTimeout(autoCbTimer);
      autoCbTimer = setTimeout(() => { if (!inferring) runCropBeauty(); }, immediate ? 0 : AUTO_INTERVAL_MS);
    }

    // ── All ──
    async function runAll() {
      if (!depthReady || !cropReady || !beautyReady || !video.srcObject || inferring) return;
      inferring = true;
      depthCanvas.classList.add('processing');
      setStatus('QCTLZ…', 'busy');
      updateAllControls();
      try {
        const [depthR, cbR] = await Promise.all([
          DepthEngine.inferDepthFromVideo(video).catch(e => ({ error: e })),
          CropBeautyEngine.runCropAndBeauty(video).catch(e => ({ error: e })),
        ]);
        if (depthR.imageData) {
          depthCanvas.width = depthR.width; depthCanvas.height = depthR.height;
          depthCtx.putImageData(depthR.imageData, 0, 0);
        }
        if (cbR.bbox) {
          lastBbox = cbR.bbox;
          drawBbox(cbR.bbox);
          updateScoreDisplay(cbR);
          setStatus(`SD ${depthR.elapsedMs?.toFixed(0)||'?'} ms / CQ ${cbR.cropMs?.toFixed(0)||'?'} ms / MX ${cbR.beautyMs?.toFixed(0)||'?'} ms`, 'ready');
        } else {
          setStatus('SDJX，CQ+XMSB', 'ready');
        }
      } catch (err) {
        setStatus('QCTLSB：' + (err.message || err), 'error');
      } finally {
        inferring = false;
        depthCanvas.classList.remove('processing');
        updateAllControls();
        scheduleAutoAll();
      }
    }
    function toggleAutoAll() {
      autoAll = !autoAll;
      autoAllBtn.textContent = autoAll ? 'QZD：K' : 'QZD：G';
      autoAllBtn.classList.toggle('active', autoAll);
      if (autoAll) scheduleAutoAll(true); else { clearTimeout(autoAllTimer); autoAllTimer = null; }
    }
    function scheduleAutoAll(immediate) {
      if (!autoAll) return;
      clearTimeout(autoAllTimer);
      autoAllTimer = setTimeout(() => { if (!inferring) runAll(); }, immediate ? 0 : AUTO_INTERVAL_MS);
    }

    function stopAllAutoExcept(keep) {
      if (keep !== 'depth') { autoDepth = false; autoDepthBtn.textContent = 'SDZD：G'; autoDepthBtn.classList.remove('active'); clearTimeout(autoDepthTimer); autoDepthTimer = null; }
      if (keep !== 'cb') { autoCb = false; autoCbBtn.textContent = 'MXZD：G'; autoCbBtn.classList.remove('active'); clearTimeout(autoCbTimer); autoCbTimer = null; }
      if (keep !== 'all') { autoAll = false; autoAllBtn.textContent = 'QZD：G'; autoAllBtn.classList.remove('active'); clearTimeout(autoAllTimer); autoAllTimer = null; }
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) {
        depthCanvas.width = video.videoWidth; depthCanvas.height = video.videoHeight;
        bboxCanvas.width = video.videoWidth; bboxCanvas.height = video.videoHeight;
        depthCtx.fillStyle = '#111';
        depthCtx.fillRect(0, 0, depthCanvas.width, depthCanvas.height);
      }
    });

    initDepth();
  </script>

</body>
</html>
