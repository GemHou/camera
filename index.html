<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>SXT + CQ + MX</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: #ddd; font-family: 'Helvetica Neue','Segoe UI',Arial,sans-serif; padding: 12px; }
    h2 { margin: 6px 0; font-size: 16px; font-weight: 600; color: #fff; letter-spacing: 1px; }
    #status { min-height: 1.4em; font-size: 11px; color: #999; margin-bottom: 8px; text-align: center; font-family: monospace; }
    #status.busy { color: #ffa500; }
    #status.ready { color: #7dffb3; }
    #status.error { color: #ff4444; }
    .panel { max-width: 580px; margin: 0 auto; }
    .panel label { display: block; font-size: 10px; color: #666; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
    .cam-wrapper { position: relative; border: 1px solid #333; border-radius: 4px; overflow: hidden; background: #000; }
    .cam-wrapper video { display: block; width: 100%; }
    .cam-wrapper canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; }
    .controls { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    button { padding: 7px 14px; font-size: 11px; border: 1px solid #444; border-radius: 3px; cursor: pointer; background: #2a2a2a; color: #ddd; font-family: inherit; letter-spacing: 0.5px; }
    button:hover:not(:disabled) { background: #3a3a3a; border-color: #ff6600; }
    button.primary { background: #cc3300; border-color: #cc3300; color: #fff; }
    button.primary:hover:not(:disabled) { background: #ff4400; }
    button.active { background: #2a6b3a; border-color: #3a9b5a; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .scores { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 6px; }
    .score-item { background: #111; border: 1px solid #2a2a2a; border-radius: 2px; padding: 4px 6px; text-align: center; }
    .score-label { font-size: 9px; color: #555; letter-spacing: 1px; }
    .score-value { font-size: 15px; font-weight: bold; color: #e94560; font-family: 'Courier New',monospace; }
    .score-value.high { color: #4CAF50; }
    .score-value.mid { color: #FF9800; }
    .hint { margin-top: 10px; font-size: 10px; color: #555; text-align: center; max-width: 520px; line-height: 1.4; font-family: monospace; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 2px; background: #444; border-radius: 1px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #cc3300; cursor: pointer; }
    #thresholdLabel { font-family: 'Courier New',monospace; font-size: 13px; color: #ff6600; min-width: 20px; }
  </style>
</head>
<body>
  <h2>SXT + CQ + MX</h2>
  <div id="status">ZZCSH…</div>

  <div class="panel">
    <label>SXT</label>
    <div class="cam-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="bboxCanvas"></canvas>
    </div>
    <div style="display:flex;gap:8px;align-items:start;margin-top:4px">
      <canvas id="cropPreview" width="160" height="90" style="border:1px solid #333;border-radius:2px;flex-shrink:0;background:#000"></canvas>
      <div class="scores" id="scoreBoard" style="flex:1">
        <div class="score-item"><div class="score-label">ZH</div><div class="score-value" id="s-total">-</div></div>
        <div class="score-item"><div class="score-label">YS</div><div class="score-value" id="s-element">-</div></div>
        <div class="score-item"><div class="score-label">GS</div><div class="score-value" id="s-story">-</div></div>
        <div class="score-item"><div class="score-label">GT</div><div class="score-value" id="s-composition">-</div></div>
        <div class="score-item"><div class="score-label">GY</div><div class="score-value" id="s-light">-</div></div>
        <div class="score-item"><div class="score-label">FW</div><div class="score-value" id="s-atmosphere">-</div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="startCamera()">QDSXT</button>
    <button id="switchCamBtn" onclick="switchCamera()" disabled>QH SXT</button>
    <button id="captureBtn" onclick="takePhoto()" disabled>PZBC</button>
    <button id="cbBtn" class="primary" onclick="runCropBeauty()" disabled>CQ+MX</button>
    <button id="autoCbBtn" onclick="toggleAuto()" disabled>ZDSX：G</button>
    <button onclick="document.getElementById('cropInput').click()">SC CQ MX</button>
    <input id="cropInput" type="file" accept=".onnx" style="display:none" onchange="handleFileUpload('crop', event)">
    <button onclick="document.getElementById('beautyInput').click()">SC MX MX</button>
    <input id="beautyInput" type="file" accept=".onnx" style="display:none" onchange="handleFileUpload('beauty', event)">
    <button id="netBtn" onclick="tryNetworkDownload()" class="primary">WL XZ</button>
    <button onclick="clearModels()" style="background:#5a1a1a">QC MX</button>
  </div>
  <div style="margin-top:8px;display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:#aaa">
    <span>YZ:</span>
    <input id="thresholdSlider" type="range" min="0" max="100" value="60" style="width:200px" oninput="updateThreshold(this.value)">
    <span id="thresholdLabel">60</span>
  </div>
  <div style="margin-top:4px;display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:#aaa">
    <span id="zoomLabel" style="display:none">Z:</span>
    <input id="zoomSlider" type="range" min="1" max="10" value="1" step="0.5" style="width:200px;display:none" oninput="updateZoom(this.value)">
  </div>

  <p class="hint">
    TLZLLQBDYX（WASM）。KS "SC MX WJ" XZ .onnx WJ，HCBDHC，BXWL。
  </p>
  <div style="display:flex;justify-content:center;gap:10px;margin-top:6px;font-size:9px;color:#444;font-family:monospace">
    <span id="versionLabel">v20260722_0106</span>
    <span id="coordsLabel">GPS: --</span>
    <span id="cityLabel">--</span>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script src="vendor/onnxruntime-web/ort.wasm.min.js?v=5"></script>
  <script src="crop_beauty.js?v=3"></script>
  <script>
    const WASM_BASE = new URL('vendor/onnxruntime-web/', window.location.href).href;
    const AUTO_INTERVAL_MS = 1500;
    const CROP_MODEL_URL = 'models/crop_model.onnx';
    const BEAUTY_MODEL_URL = 'models/beauty_score.onnx';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const bboxCanvas = document.getElementById('bboxCanvas');
    const bboxCtx = bboxCanvas.getContext('2d');
    const cropPreview = document.getElementById('cropPreview');
    const cropPreviewCtx = cropPreview.getContext('2d');
    const statusEl = document.getElementById('status');
    const captureBtn = document.getElementById('captureBtn');
    const cbBtn = document.getElementById('cbBtn');
    const autoCbBtn = document.getElementById('autoCbBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    let cameraList = [];
    let cameraIndex = 0;
    const netBtn = document.getElementById('netBtn');

    const SCORE_KEYS = ['total','element','story','composition','light','atmosphere'];

    let cropReady = false;
    let beautyReady = false;
    let inferring = false;
    let autoMode = false;
    let autoTimer = null;
    let threshold = 60;

    function updateThreshold(val) {
      threshold = parseInt(val);
      document.getElementById('thresholdLabel').textContent = threshold;
    }

    function updateZoom(val) {
      const v = parseFloat(val);
      document.getElementById('zoomLabel').textContent = `Z:${v.toFixed(1)}x`;
      if (window._zoomTrack) {
        window._zoomTrack.applyConstraints({ advanced: [{ zoom: v }] }).catch(() => {
          // Phone rejected this zoom level, snap back to min supported
          if (window._zoomRange && v < window._zoomRange.min) {
            document.getElementById('zoomSlider').value = window._zoomRange.min;
            document.getElementById('zoomLabel').textContent = `Z:${window._zoomRange.min.toFixed(1)}x`;
          }
        });
      }
    }

    function setStatus(text, kind = '') {
      statusEl.textContent = text; statusEl.className = kind;
    }

    function updateScoreDisplay(scores) {
      for (const k of SCORE_KEYS) {
        const el = document.getElementById('s-' + k);
        const v = Math.round(scores[k]);
        el.textContent = v;
        el.className = 'score-value' + (v >= 75 ? ' high' : v >= 50 ? ' mid' : '');
      }
    }

    function drawBbox(bbox) {
      drawMultiBbox(bbox ? [bbox] : [], 0);
    }

    function drawMultiBbox(bboxes, bestIdx) {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      bboxCanvas.width = vw; bboxCanvas.height = vh;
      bboxCtx.clearRect(0, 0, vw, vh);
      if (!bboxes.length) return;
      const colors = ['#FF4444', '#44FF44', '#4488FF'];
      for (let k = 0; k < bboxes.length; k++) {
        const b = bboxes[k];
        const bx = Math.round(b[0]*vw), by = Math.round(b[1]*vh);
        const bw = Math.round((b[2]-b[0])*vw), bh = Math.round((b[3]-b[1])*vh);
        bboxCtx.strokeStyle = k === bestIdx ? '#00FF00' : colors[k];
        bboxCtx.lineWidth = k === bestIdx ? Math.max(3, vw/320) : Math.max(1, vw/500);
        bboxCtx.setLineDash(k === bestIdx ? [] : [4, 4]);
        bboxCtx.strokeRect(bx, by, bw, bh);
      }
      bboxCtx.setLineDash([]);
    }

    function updateControls() {
      const camOn = !!video.srcObject;
      cbBtn.disabled = !(cropReady && beautyReady && camOn && !inferring);
      autoCbBtn.disabled = !(cropReady && beautyReady && camOn);
    }

    async function init() {
      netBtn.style.display = 'none';
      if (location.protocol === 'file:') {
        setStatus('QY http://127.0.0.1:8080 DK', 'error');
        return;
      }
      if (typeof ort === 'undefined') {
        setStatus('ONNX Runtime WJZ', 'error');
        return;
      }
      // Xian chang HC
      setStatus('JC BDHC…');
      const [cropBuf, beautyBuf] = await Promise.all([
        CropBeautyEngine.loadCached(CACHE_KEY + '_crop'),
        CropBeautyEngine.loadCached(CACHE_KEY + '_beauty'),
      ]);

      if (cropBuf && beautyBuf) {
        setStatus('ZHC MX…');
        CropBeautyEngine.configureCbOrt(WASM_BASE);
        await Promise.all([
          CropBeautyEngine.initCropFromBuffer(cropBuf, { onStatus: t => setStatus(t) }),
          CropBeautyEngine.initBeautyFromBuffer(beautyBuf, { onStatus: t => setStatus(t) }),
        ]);
        cropReady = true; beautyReady = true;
        setStatus('MXJX，QQDSXT', 'ready');
        updateControls();
        return;
      }

      // Mei HC, xian shi SC + WL an niu
      setStatus('QSC .onnx WJ, huo dian WL XZ', '');
      netBtn.style.display = '';
    }

    async function handleFileUpload(type, event) {
      const file = event.target.files?.[0];
      if (!file) return;
      setStatus(`JZ ${type} MX…`, 'busy');
      try {
        CropBeautyEngine.configureCbOrt(WASM_BASE);
        const buf = await file.arrayBuffer();
        if (type === 'crop') {
          await CropBeautyEngine.initCropFromBuffer(buf, { onStatus: t => setStatus(t) });
          cropReady = true;
        } else {
          await CropBeautyEngine.initBeautyFromBuffer(buf, { onStatus: t => setStatus(t) });
          beautyReady = true;
        }
        if (cropReady && beautyReady) {
          setStatus('MXJX，QQDSXT', 'ready');
          updateControls();
        } else {
          setStatus(`${type} MXJX，QSC LX MX`, 'ready');
        }
      } catch (err) {
        setStatus(`${type} MX JZSB: ` + (err.message || err), 'error');
      }
    }

    let netDownloading = false;
    async function tryNetworkDownload() {
      if (netDownloading) return;
      netDownloading = true; netBtn.disabled = true;
      setStatus('ZLXZ MX…', 'busy');
      try {
        CropBeautyEngine.configureCbOrt(WASM_BASE);
        await Promise.all([
          CropBeautyEngine.initCropModel({ modelUrl: CROP_MODEL_URL, onStatus: t => setStatus(t) }).then(() => { cropReady = true; }),
          CropBeautyEngine.initBeautyModel({ modelUrl: BEAUTY_MODEL_URL, onStatus: t => setStatus(t) }).then(() => { beautyReady = true; }),
        ]);
        setStatus('MXJX，QQDSXT', 'ready');
        updateControls();
      } catch (err) {
        setStatus('WLXZSB，QSC WJ' + (err.message || err), 'error');
      } finally {
        netDownloading = false; netBtn.disabled = false;
      }
    }

    async function clearModels() {
      if (!confirm('QRQCMX？ZHCQ CSCX。')) return;
      cropReady = false; beautyReady = false;
      cropSession = null; beautySession = null;
      try {
        const db = await new Promise((r) => { const d = indexedDB.open('camera-cb-cache', 1); d.onsuccess = () => r(d.result); d.onerror = () => r(null); });
        if (db) { db.close(); indexedDB.deleteDatabase('camera-cb-cache'); }
      } catch {}
      setStatus('MXQCCG，CKSC WJ huo WL XZ', 'ready');
      updateControls();
      netBtn.style.display = '';
    }

    async function startCamera() {
      try {
        if (cameraList.length === 0) {
          // Warmup + enumerate ALL cameras including ultrawide/telephoto
          const tmp = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          }).catch(() => null);
          if (tmp) {
            const track = tmp.getVideoTracks()[0];
            // Try to zoom out to trigger ultrawide enumeration
            try { await track.applyConstraints({ advanced: [{ zoom: 0.5 }] }); } catch {}
            track.stop();
          }
          // Enumerate after warmup
          const all = await navigator.mediaDevices.enumerateDevices();
          const seen = new Set();
          cameraList = all.filter(d => d.kind === 'videoinput' && d.deviceId && !seen.has(d.deviceId) && seen.add(d.deviceId));
          // Try each camera to get its zoom range and label it
          for (const cam of cameraList) {
            try {
              const s = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: cam.deviceId }, width: 320, height: 240 },
                audio: false
              });
              const t = s.getVideoTracks()[0];
              const cap = t.getCapabilities?.();
              if (cap?.zoom) {
                cam.zoomMin = cap.zoom.min;
                cam.zoomMax = cap.zoom.max;
              } else {
                const settings = t.getSettings();
                cam.zoomMin = settings?.zoom || 1;
                cam.zoomMax = settings?.zoom || 1;
              }
              t.stop();
            } catch {}
          }
          // Sort: cameras with wider zoom range first
          cameraList.sort((a, b) => (b.zoomMax - b.zoomMin) - (a.zoomMax - a.zoomMin));
          if (cameraList.length === 0) cameraList = [{ deviceId: '', label: 'default' }];
        }
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
        }
        const cam = cameraList[cameraIndex];
        const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
        if (cam.deviceId) constraints.video.deviceId = { exact: cam.deviceId };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        const track = stream.getVideoTracks()[0];
        const cap = track.getCapabilities?.();
        window._zoomRange = (cap?.zoom) ? { min: Math.min(cap.zoom.min, 0.5), max: Math.max(cap.zoom.max, 1) } : { min: 0.5, max: 10 };
        window._zoomTrack = track;
        video.srcObject = stream;
        await video.play();
        captureBtn.disabled = false;
        switchCamBtn.disabled = cameraList.length <= 1;
        switchCamBtn.textContent = `QH ${cameraIndex+1}/${cameraList.length}`;
        const zs = document.getElementById('zoomSlider');
        const zl = document.getElementById('zoomLabel');
        if (zs) {
          const r = window._zoomRange || { min: 0.5, max: 10 };
          zs.min = Math.min(r.min, 0.5);
          zs.max = Math.max(r.max, 10);
          zs.step = Math.max(0.01, (zs.max-zs.min)/20);
          zs.value = Math.max(zs.min, 1);
          zs.style.display = ''; zl.style.display = '';
          updateZoom(zs.value);
        }
        updateControls();
        setStatus('JX', 'ready');
        // location
        (function locate(){
          const cl = document.getElementById('coordsLabel');
          const vl = document.getElementById('cityLabel');
          cl.textContent = 'DWZ…'; vl.textContent = '';

          function showCoords(lat, lng, src) {
            cl.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)} (${src})`;
            vl.textContent = 'ZZ…';
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), 5000);
            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=zh`,
              { signal: ctrl.signal })
              .then(r => r.json()).then(d => {
                const parts = [d.principalSubdivision, d.city, d.locality].filter(Boolean);
                vl.textContent = parts.join(' ') || '--';
              }).catch(() => { vl.textContent = '--'; });
          }

          if (!('geolocation' in navigator)) {
            cl.textContent = 'SB'; vl.textContent = 'no GPS';
            return;
          }
          navigator.geolocation.getCurrentPosition(
            (p) => showCoords(p.coords.latitude, p.coords.longitude, 'GPS'),
            () => {
              cl.textContent = 'DWZ… (WL)';
              navigator.geolocation.getCurrentPosition(
                (p) => showCoords(p.coords.latitude, p.coords.longitude, 'WL'),
                () => {
                  cl.textContent = 'DWZ… (IP)';
                  fetch('https://ip-api.com/json/?fields=lat,lon,status').then(r=>r.json()).then(d => {
                    if (d.status==='success') showCoords(d.lat, d.lon, 'IP');
                    else throw Error();
                  }).catch(() => {
                    fetch('https://ipinfo.io/json').then(r=>r.json()).then(d => {
                      if (d.loc) { const c=d.loc.split(','); showCoords(parseFloat(c[0]), parseFloat(c[1]), 'IP'); }
                      else cl.textContent = 'SB';
                    }).catch(() => { cl.textContent = 'SB'; });
                  });
                },
                { enableHighAccuracy: false, timeout: 8000 }
              );
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        })();
      } catch (err) {
        alert('SXTQDSB' + err);
      }
    }

    function switchCamera() {
      if (cameraList.length === 0) return;
      cameraIndex = (cameraIndex + 1) % cameraList.length;
      startCamera();
    }

    function takePhoto() {
      if (!video.srcObject) { alert('QQXQDSXT'); return; }
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `photo-${Date.now()}.jpg`; a.click();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.95);
    }

    async function runCropBeauty() {
      if (!cropReady || !beautyReady || !video.srcObject || inferring) return;
      inferring = true;
      setStatus('TLZ…', 'busy');
      updateControls();
      try {
        const r = await CropBeautyEngine.runCropAndBeauty(video, t => setStatus(t, 'busy'));
        // Draw winning bbox in green, others in dim colors
        const allBboxes = await CropBeautyEngine.getAllBboxes(video);
        drawMultiBbox(allBboxes, r.bboxIdx);
        updateScoreDisplay(r);
        const vw = video.videoWidth, vh = video.videoHeight;
        const bx = [Math.round(r.bbox[0]*vw), Math.round(r.bbox[1]*vh), Math.round(r.bbox[2]*vw), Math.round(r.bbox[3]*vh)];
        cropPreviewCtx.drawImage(video, bx[0], bx[1], bx[2]-bx[0], bx[3]-bx[1], 0, 0, cropPreview.width, cropPreview.height);
        setStatus(`CQ ${r.cropMs.toFixed(0)}ms MX ${r.beautyMs.toFixed(0)}ms (M${r.bboxIdx})`, 'ready');
        if (r.total >= threshold) {
          playBeep();
          downloadCropped(r.bbox);
        }
      } catch (err) {
        setStatus('TLSB' + (err.message || err), 'error');
      } finally {
        inferring = false;
        updateControls();
        scheduleAuto();
      }
    }

    function playBeep() {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.value = 0.3;
        osc.start(); osc.stop(ac.currentTime + 0.3);
      } catch {}
    }

    function downloadCropped(bbox) {
      const vw = video.videoWidth, vh = video.videoHeight;
      const bx = Math.round(bbox[0]*vw), by = Math.round(bbox[1]*vh);
      let bw = Math.round((bbox[2]-bbox[0])*vw), bh = Math.round((bbox[3]-bbox[1])*vh);
      if (bw <= 0 || bh <= 0) return;
      // ensure minimum output size
      const minSize = 1920;
      let scale = 1;
      while (bw * scale < minSize && bh * scale < minSize) scale *= 2;
      const c = document.createElement('canvas');
      c.width = Math.round(bw * scale); c.height = Math.round(bh * scale);
      c.getContext('2d').drawImage(video, bx, by, bw, bh, 0, 0, c.width, c.height);
      c.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `highscore_${Math.round(Date.now()/1000)}.jpg`;
        a.click();
        URL.revokeObjectURL(blob);
      }, 'image/jpeg', 0.95);
    }

    function toggleAuto() {
      autoMode = !autoMode;
      autoCbBtn.textContent = autoMode ? 'ZDSX：K' : 'ZDSX：G';
      autoCbBtn.classList.toggle('active', autoMode);
      if (autoMode) scheduleAuto(true);
      else { clearTimeout(autoTimer); autoTimer = null; }
    }

    function scheduleAuto(immediate = false) {
      if (!autoMode) return;
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => { if (!inferring) runCropBeauty(); }, immediate ? 0 : AUTO_INTERVAL_MS);
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) {
        bboxCanvas.width = video.videoWidth; bboxCanvas.height = video.videoHeight;
      }
    });

    init();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
